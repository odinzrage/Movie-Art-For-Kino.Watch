name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create a release on tag push

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: base64 keystore + passwords in repo secrets. Without them the release APK
      # is signed with the (per-run) debug key - fine for testing, but users cannot update over it.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p out
          cp movie-art-plugin/build/outputs/apk/debug/*.apk out/movie-art-kinowatch-debug.apk
          cp movie-art-plugin/build/outputs/apk/release/*.apk out/movie-art-kinowatch.apk

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: out/*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/movie-art-kinowatch.apk
          generate_release_notes: true
