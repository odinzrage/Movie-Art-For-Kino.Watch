
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $secret_name"
              exit 1
            fi
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode and validate release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp movie-art-plugin/build/outputs/apk/debug/*.apk out/movie-art-kinowatch-debug.apk
          cp movie-art-plugin/build/outputs/apk/release/*.apk out/movie-art-kinowatch.apk

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="out/movie-art-kinowatch.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Diagnose release signing certificate
        if: env.RELEASE_STORE_FILE != ''
        shell: bash
        run: |
          set -euo pipefail
          APK="out/movie-art-kinowatch.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          KEY_CERT_SHA="$(keytool -exportcert -keystore "$RELEASE_STORE_FILE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          APK_CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' | tr -d ':')"
          echo "Configured keystore certificate SHA-256: $KEY_CERT_SHA"
          echo "Built APK signer certificate SHA-256:   $APK_CERT_SHA"
          if [[ "$APK_CERT_SHA" == "$KEY_CERT_SHA" ]]; then
            echo "Signing diagnosis: MATCH"
          else
            echo "::warning::Signing diagnosis: MISMATCH"
          fi

      - name: Verify release certificate matches keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          APK="out/movie-art-kinowatch.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          KEY_CERT_SHA="$(keytool -exportcert -keystore "$RELEASE_STORE_FILE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)"
          APK_CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' | tr -d ':')"
          KEY_CERT_SHA="$(printf '%s' "$KEY_CERT_SHA" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [[ -z "$APK_CERT_SHA" || "$APK_CERT_SHA" != "$KEY_CERT_SHA" ]]; then
            echo "::error::Release APK certificate does not match the configured release keystore."
            exit 1
          fi
          echo "Release APK is signed with the configured release certificate."

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: out/*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/movie-art-kinowatch.apk
          generate_release_notes: true
